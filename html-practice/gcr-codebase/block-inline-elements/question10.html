<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option>Japan</option>
        <option selected>India</option>
        <option>Italy</option>
        <option>Canada</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option>Punjab</option>
        <option selected>Rajasthan</option>
        <option>Kerala</option>
        <option>Gujarat</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option>Jaipur</option>
        <option selected>Udaipur</option>
        <option>Jodhpur</option>
        <option>Ajmer</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option>Goa</option>
        <option>Manali</option>
        <option selected>Lake Pichola</option>
        <option>Kerala Backwaters</option>
    </select>

    <p>
        My selected country is India, my state is Rajasthan,
        my city is Udaipur, and my favorite tourist place is Lake Pichola.
    </p>

</body>
</html>
