<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <h1>GLA Public School</h1>

    <h2>Student Report Card</h2>

    <!-- rowspan, colspan and title attributes used for clarity -->
    <table border="1" title="Student Marks Report">
        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>94</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>89</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>97</td>
        </tr>

        <tr>
            <td>Chemistry</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <td title="Total marks obtained">453 / 500</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td>90.6%</td>
        </tr>
    </table>

</body>
</html>
